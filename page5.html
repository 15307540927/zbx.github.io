 <!-- 主要内容 -->
    <section class="py-10 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">心理测评</h2>
        </div>
        <!-- 智能体嵌入区域 -->
        <div class="bg-white rounded-xl shadow-lg p-6 md:p-8">
            <div class="border-2 border-dashed border-primary/30 rounded-lg p-8 text-center mb-6">
                <i class="fa-solid fa-robot text-primary text-4xl mb-4"></i>

                <iframe src="https://minke8.cn/gd3.html" class="w-full h-[600px] border-0 rounded-lg mt-4" frameborder="0"></iframe>

    <footer class="bg-warm-brown text-white py-8">
        <div class="container mx-auto px-4">

                <div class="mb-4 md:mb-0">
                    <div class="flex items-center justify-center md:justify-start">
                        <i class="fa fa-heart text-warm-yellow text-2xl mr-2"></i>
                        <span class="text-xl font-bold">心灵“易”站</span>

                心理援助热线：12356 | 工作时间：周一至周日 08:00-22:00
            </div>
        </div>
    </footer>
    <!-- 脚本逻辑 -->
    <script>
        // 验证登录状态
        window.addEventListener('DOMContentLoaded', () => {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }
            // 显示用户名
            const user = JSON.parse(currentUser);
            document.getElementById('userName').textContent = `欢迎，${user.name}`;

            // 退出登录
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            });

            // 移动端菜单切换
            document.getElementById('menuBtn').addEventListener('click', () => {
                const mobileMenu = document.getElementById('mobileMenu');
                mobileMenu.classList.toggle('hidden');
            });

            // 平滑滚动到案例
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href');
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        window.scrollTo({
                            top: targetElement.offsetTop - 80,
                            behavior: 'smooth'
                        });
                    }
                });
            });
        });
    </script>
