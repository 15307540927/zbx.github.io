<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何和同学友好相处：沟通小技巧</title>
    <style>
        :root {
            /* 配色方案：温馨、明亮、柔和 */
            --bg-color: #FDFBF7; /* 米白背景 */
            --primary-blue: #A0C4FF; /* 角色A */
            --primary-pink: #FFADAD; /* 角色B */
            --accent-yellow: #FDFFB6; /* 提示/光 */
            --accent-green: #CAFFBF; /* 和平/解决 */
            --text-main: #505050;
            --text-sub: #888888;
            --font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ECE9E6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-family);
            overflow: hidden;
        }

        /* 电影屏幕容器 */
        #stage {
            width: 960px;
            height: 540px; /* 16:9 比例 */
            background-color: var(--bg-color);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.95);
            animation: stageFadeIn 1s ease-out forwards;
        }

        @keyframes stageFadeIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* 电影遮幅 (Cinematic Bars) */
        .cinema-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 0; /* 初始无遮幅，播放时展开 */
            background-color: #222;
            z-index: 100;
            transition: height 1s ease;
        }
        .bar-top { top: 0; }
        .bar-bottom { bottom: 0; }

        /* 场景元素通用 */
        .actor {
            position: absolute;
            bottom: 140px;
            width: 120px;
            height: 120px;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }
        
        /* 角色 SVG 样式 */
        .actor svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        #blue-actor { left: 250px; }
        #pink-actor { right: 250px; }

        /* 表情/符号容器 */
        .symbol-container {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            opacity: 0;
            transition: all 0.4s ease;
        }

        /* 道具：对话气泡 */
        .bubble {
            position: absolute;
            background: white;
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 16px;
            color: var(--text-main);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            z-index: 15;
        }
        .bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        /* 背景装饰元素 */
        .bg-decor {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            transition: all 2s ease;
        }
        .circle-1 { width: 300px; height: 300px; background: #F0F4F8; top: -50px; left: -50px; }
        .circle-2 { width: 200px; height: 200px; background: #FFF0F5; bottom: 50px; right: -20px; }
        
        /* 标题层 */
        #title-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background: rgba(253, 251, 247, 0.9);
            transition: opacity 1s;
        }
        #title-layer h1 {
            color: var(--text-main);
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #title-layer p {
            color: var(--text-sub);
            font-size: 18px;
            font-weight: 300;
        }

        /* 字幕层 */
        #subtitle-container {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            z-index: 110; /* 在遮幅之上 */
            opacity: 0;
            transition: opacity 0.5s;
        }
        .sub-cn {
            font-size: 24px;
            color: white;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
            display: block;
        }
        .sub-en {
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            font-weight: 300;
            font-style: italic;
            display: block;
        }

        /* 特效：锯齿线（冲突） */
        .jagged-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 4px;
            background: #FF6B6B;
            transform: translate(-50%, -20%) rotate(-10deg);
            z-index: 5;
            opacity: 0;
        }

        /* 特效：连接桥（共情） */
        .bridge {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 10px;
            background: var(--accent-green);
            border-radius: 5px;
            opacity: 0;
            transition: width 1s ease;
        }

        /* 关键帧动画类 */
        .anim-shake { animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .anim-breathe { animation: breathe 3s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        .anim-nod { animation: nod 0.6s ease-in-out 2; }
        @keyframes nod {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }

        /* 知识点卡片 */
        .tip-card {
            position: absolute;
            top: 80px;
            right: 40px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transform: translateX(200px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }
        .tip-card h3 {
            margin: 0 0 5px 0;
            color: var(--primary-blue);
            font-size: 16px;
        }
        .tip-card p {
            margin: 0;
            color: var(--text-main);
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div id="stage">
        <!-- 背景装饰 -->
        <div class="bg-decor circle-1"></div>
        <div class="bg-decor circle-2"></div>

        <!-- 电影遮幅 -->
        <div class="cinema-bar bar-top"></div>
        <div class="cinema-bar bar-bottom"></div>

        <!-- 标题画面 -->
        <div id="title-layer">
            <h1>如何和同学友好相处</h1>
            <p>Communication Skills 101</p>
            <p style="font-size: 12px; margin-top: 20px; opacity: 0.6;">即将开始播放 / Starting soon...</p>
        </div>

        <!-- 知识点卡片 -->
        <div id="tip-card" class="tip-card">
            <h3 id="tip-title">Tip 1</h3>
            <p id="tip-desc">Content</p>
        </div>

        <!-- 角色：小蓝 -->
        <div id="blue-actor" class="actor anim-breathe">
            <div class="symbol-container" id="blue-symbol"></div>
            <div class="bubble" id="blue-bubble" style="bottom: 110%; left: 0;"></div>
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#A0C4FF" />
                <circle cx="35" cy="45" r="5" fill="#333" />
                <circle cx="65" cy="45" r="5" fill="#333" />
                <path id="blue-mouth" d="M 35 60 Q 50 70 65 60" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
            </svg>
        </div>

        <!-- 角色：小粉 -->
        <div id="pink-actor" class="actor anim-breathe">
            <div class="symbol-container" id="pink-symbol"></div>
            <div class="bubble" id="pink-bubble" style="bottom: 110%; right: 0;"></div>
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#FFADAD" />
                <circle cx="35" cy="45" r="5" fill="#333" />
                <circle cx="65" cy="45" r="5" fill="#333" />
                <path id="pink-mouth" d="M 35 60 Q 50 70 65 60" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
            </svg>
        </div>

        <!-- 冲突线 -->
        <div class="jagged-line" id="jagged-line"></div>
        
        <!-- 连接桥 -->
        <div class="bridge" id="bridge"></div>

        <!-- 字幕 -->
        <div id="subtitle-container">
            <span class="sub-cn" id="sub-cn"></span>
            <span class="sub-en" id="sub-en"></span>
        </div>
    </div>

    <script>
        // 剧本控制系统
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // DOM 元素获取
        const els = {
            stage: document.getElementById('stage'),
            titleLayer: document.getElementById('title-layer'),
            topBar: document.querySelector('.bar-top'),
            bottomBar: document.querySelector('.bar-bottom'),
            subContainer: document.getElementById('subtitle-container'),
            subCn: document.getElementById('sub-cn'),
            subEn: document.getElementById('sub-en'),
            blue: document.getElementById('blue-actor'),
            pink: document.getElementById('pink-actor'),
            blueMouth: document.getElementById('blue-mouth'),
            pinkMouth: document.getElementById('pink-mouth'),
            blueSymbol: document.getElementById('blue-symbol'),
            pinkSymbol: document.getElementById('pink-symbol'),
            blueBubble: document.getElementById('blue-bubble'),
            pinkBubble: document.getElementById('pink-bubble'),
            jaggedLine: document.getElementById('jagged-line'),
            bridge: document.getElementById('bridge'),
            tipCard: document.getElementById('tip-card'),
            tipTitle: document.getElementById('tip-title'),
            tipDesc: document.getElementById('tip-desc')
        };

        // 动画控制函数
        async function setSubtitle(cn, en, duration = 3000) {
            els.subCn.innerText = cn;
            els.subEn.innerText = en;
            els.subContainer.style.opacity = 1;
            await wait(duration);
            els.subContainer.style.opacity = 0;
            await wait(500); // 间隔
        }

        function showSymbol(actor, symbol) {
            const el = actor === 'blue' ? els.blueSymbol : els.pinkSymbol;
            el.innerText = symbol;
            el.style.opacity = 1;
            el.style.top = '-70px';
        }

        function hideSymbol(actor) {
            const el = actor === 'blue' ? els.blueSymbol : els.pinkSymbol;
            el.style.opacity = 0;
            el.style.top = '-60px';
        }

        function showBubble(actor, text) {
            const el = actor === 'blue' ? els.blueBubble : els.pinkBubble;
            el.innerText = text;
            el.style.opacity = 1;
            el.style.transform = 'scale(1)';
        }

        function hideBubble(actor) {
            const el = actor === 'blue' ? els.blueBubble : els.pinkBubble;
            el.style.opacity = 0;
            el.style.transform = 'scale(0.5)';
        }

        function showTip(title, desc) {
            els.tipTitle.innerText = title;
            els.tipDesc.innerText = desc;
            els.tipCard.style.transform = 'translateX(0)';
        }

        function hideTip() {
            els.tipCard.style.transform = 'translateX(200px)';
        }

        function setMouth(actor, type) {
            const el = actor === 'blue' ? els.blueMouth : els.pinkMouth;
            if (type === 'sad') el.setAttribute('d', 'M 35 65 Q 50 55 65 65');
            else if (type === 'neutral') el.setAttribute('d', 'M 35 60 L 65 60');
            else if (type === 'happy') el.setAttribute('d', 'M 35 60 Q 50 70 65 60');
            else if (type === 'talk') el.setAttribute('d', 'M 40 60 Q 50 75 60 60');
        }

        // --- 电影主流程 ---
        async function playMovie() {
            await wait(1000);

            // 1. 开场：淡出标题，进入电影模式
            els.titleLayer.style.opacity = 0;
            await wait(1000);
            els.titleLayer.style.display = 'none';
            
            // 展开遮幅
            els.topBar.style.height = '60px';
            els.bottomBar.style.height = '80px'; // 底部留给字幕
            
            await setSubtitle("在学校里，我们每天都会和同学相处。", "We interact with classmates every day at school.");
            
            // 2. 冲突场景
            await setSubtitle("但有时候，误解和争吵难免会发生。", "But sometimes, misunderstandings and arguments happen.");
            
            // 动作：靠近，生气
            els.blue.style.left = '350px';
            els.pink.style.right = '350px';
            await wait(800);
            
            setMouth('blue', 'sad');
            setMouth('pink', 'sad');
            showSymbol('blue', '💢');
            showSymbol('pink', '😤');
            els.blue.classList.add('anim-shake');
            els.pink.classList.add('anim-shake');
            
            // 出现冲突线
            els.jaggedLine.style.width = '100px';
            els.jaggedLine.style.opacity = 1;
            
            await setSubtitle("当矛盾发生时，我们该怎么办？", "What should we do when conflicts arise?");
            
            // 3. 技巧一：倾听
            hideSymbol('blue');
            hideSymbol('pink');
            els.blue.classList.remove('anim-shake');
            els.pink.classList.remove('anim-shake');
            els.jaggedLine.style.opacity = 0;
            await wait(500);

            showTip("技巧一：用心倾听", "Tip 1: Active Listening");
            await setSubtitle("第一步：冷静下来，用心倾听。", "Step 1: Calm down and listen actively.");

            // 动作：小粉说话，小蓝倾听
            showBubble('pink', "我很生气因为...");
            setMouth('pink', 'talk');
            setMouth('blue', 'neutral');
            showSymbol('blue', '👂'); // 耳朵图标
            
            // 小蓝点头
            els.blue.classList.add('anim-nod');
            
            await setSubtitle("不要打断，试着理解对方的想法。", "Don't interrupt. Try to understand their perspective.", 4000);
            
            hideBubble('pink');
            hideSymbol('blue');
            els.blue.classList.remove('anim-nod');
            setMouth('pink', 'neutral');
            
            // 4. 技巧二：表达
            hideTip();
            await wait(500);
            showTip("技巧二：表达感受", "Tip 2: Use 'I' Statements");
            
            await setSubtitle("第二步：用“我觉得”来表达感受。", "Step 2: Use 'I feel' to express your emotions.");
            
            // 动作：小蓝说话
            setMouth('blue', 'talk');
            showBubble('blue', "我觉得有点难过..."); 
            // 避免指责的手指，而是用心
            showSymbol('blue', '❤️');
            
            await setSubtitle("不要指责对方，而是说出自己的需求。", "Focus on your needs, not blaming others.", 4000);
            
            hideBubble('blue');
            hideSymbol('blue');
            setMouth('blue', 'neutral');

            // 5. 技巧三：共情与和解
            hideTip();
            await wait(500);
            showTip("技巧三：换位思考", "Tip 3: Empathy");
            
            await setSubtitle("最后，试着换位思考，互相包容。", "Finally, put yourself in their shoes.");
            
            // 动作：搭建桥梁
            els.bridge.style.opacity = 1;
            els.bridge.style.width = '200px';
            
            // 两人靠近
            els.blue.style.left = '400px';
            els.pink.style.right = '400px';
            
            await wait(1000);
            
            // 变开心
            setMouth('blue', 'happy');
            setMouth('pink', 'happy');
            showSymbol('blue', '✨');
            showSymbol('pink', '✨');
            
            // 背景变亮
            document.querySelector('.circle-1').style.transform = 'scale(1.2)';
            document.querySelector('.circle-2').style.transform = 'scale(1.2)';

            hideTip();
            await setSubtitle("良好的沟通，让友谊像花园一样美好。", "Good communication makes friendship bloom like a garden.");
            
            // 6. 结尾
            await wait(1000);
            els.titleLayer.style.display = 'flex';
            els.titleLayer.innerHTML = '<h1>The End</h1><p>愿你们都能收获真挚的友谊</p>';
            els.titleLayer.style.opacity = 1;
            
            // 收起遮幅
            els.topBar.style.height = '0';
            els.bottomBar.style.height = '0';
        }

        // 启动
        window.onload = playMovie;

    </script>
</body>
</html>
